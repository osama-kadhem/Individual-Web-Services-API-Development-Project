<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronMind API | Reference Manual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        /* Modern Professional Theme - Neutral & Clean */
        :root {
            --primary: #0F172A;
            /* Deep Slate */
            --accent: #2563EB;
            /* Professional Blue */
            --bg: #FFFFFF;
            --sidebar: #F8FAFC;
            --border: #E2E8F0;
            --text: #1E293B;
            --text-muted: #64748B;
            --code-bg: #0F172A;
            --sans: "Inter", sans-serif;
            --mono: "JetBrains Mono", monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
        }

        /* Unified Navigation Bar */
        #topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            height: 56px;
            background: #FFFFFF;
            border-bottom: 1px solid var(--border);
            font-family: var(--sans);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: -0.02em;
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.15s ease;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .nav-links a.active {
            color: var(--primary);
            font-weight: 600;
        }

        /* ReDoc Scroll Fix */
        #redoc-container {
            margin-top: 0;
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 80vh;
            font-family: var(--sans);
            color: var(--text-muted);
        }

        /* Print Button */
        .print-btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: var(--sans);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .print-btn:hover {
            background: #1d4ed8;
        }

        /* ===================== PRINT STYLES ===================== */
        @media print {

            /* Hide chrome */
            #topbar {
                display: none !important;
            }

            /* Hide ReDoc sidebar entirely */
            .menu-content,
            [class*="SideMenu"],
            [class*="sidebar"],
            redoc>div>div:first-child {
                display: none !important;
            }

            /* Make main content full width */
            redoc,
            .redoc-wrap,
            [class*="api-content"],
            [class*="middle-panel"] {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Turn dark right panel white */
            [class*="right-panel"],
            [class*="ResponseSamples"],
            [class*="dark"] {
                background: #ffffff !important;
                color: #1e293b !important;
            }

            /* Make all code blocks legible */
            pre,
            code,
            [class*="CodeSample"],
            [class*="code-box"] {
                background: #f8fafc !important;
                color: #1e293b !important;
                border: 1px solid #e2e8f0 !important;
                white-space: pre-wrap !important;
                word-break: break-word !important;
                font-size: 11px !important;
            }

            /* Expand all collapsed sections */
            [class*="operation-type"],
            [class*="OperationContainer"],
            details {
                display: block !important;
            }

            /* Page break rules */
            h1,
            h2,
            h3 {
                page-break-after: avoid;
            }

            table,
            pre {
                page-break-inside: avoid;
            }

            /* Page margins */
            @page {
                margin: 1.5cm;
                size: A4;
            }

            body {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="topbar">
        <a href="/" class="brand">
            <div class="brand-icon">IM</div>
            <span>IronMind Coach</span>
        </a>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/docs">Console</a>
            <a href="/redoc" class="active">API Reference</a>
            <button class="print-btn" onclick="window.print()">🖨 Print to PDF</button>
        </div>
    </div>

    <div id="redoc-container">
        <div class="loading">Preparing API Reference...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>
    <script>
        Redoc.init('/openapi.json', {
            theme: {
                colors: {
                    primary: { main: '#0F172A' },
                    success: { main: '#10B981' },
                    warning: { main: '#F59E0B' },
                    error: { main: '#EF4444' },
                    text: {
                        primary: '#1E293B',
                        secondary: '#64748B',
                    },
                    border: {
                        dark: '#E2E8F0',
                        light: '#F1F5F9',
                    },
                    http: {
                        get: '#10B981',
                        post: '#2563EB',
                        put: '#F59E0B',
                        delete: '#EF4444',
                    }
                },
                typography: {
                    fontFamily: 'Inter, sans-serif',
                    fontSize: '15px',
                    lineHeight: '1.6',
                    headings: {
                        fontFamily: 'Inter, sans-serif',
                        fontWeight: '700',
                    },
                    code: {
                        fontFamily: 'JetBrains Mono, monospace',
                        fontSize: '13px',
                        backgroundColor: '#F1F5F9',
                        color: '#1E293B',
                    }
                },
                sidebar: {
                    backgroundColor: '#F8FAFC',
                    width: '280px',
                    textColor: '#64748B',
                    activeTextColor: '#2563EB',
                },
                rightPanel: {
                    backgroundColor: '#0F172A',
                    textColor: '#E2E8F0',
                    width: '40%',
                },
                shape: {
                    borderRadius: '6px',
                },
                overrideStyles: `
                    /* Navbar Hide */
                    .redoc-wrap > div:first-child { display: none !important; }
                    
                    /* Sidebar Styling */
                    .menu-content { 
                        border-right: 1px solid #E2E8F0 !important;
                        padding-top: 1.5rem !important;
                    }

                    /* Sidebar active item */
                    .menu-item-title.active {
                        border-right: 3px solid #2563EB !important;
                        background: #F1F5F9 !important;
                    }

                    /* Search Box */
                    .search-input {
                        background: #FFFFFF !important;
                        border: 1px solid #CBD5E1 !important;
                        border-radius: 6px !important;
                        font-family: inherit !important;
                    }

                    /* Content Padding */
                    .api-content { padding-top: 2rem !important; }

                    /* Code Blocks */
                    pre, code {
                        font-family: 'JetBrains Mono', monospace !important;
                    }

                    /* Required label */
                    .required-label { color: #DC2626 !important; }
                    
                    /* Response tabs */
                    .tab-header button.active {
                        color: #2563EB !important;
                        border-bottom: 2px solid #2563EB !important;
                    }
                `
            },
            hideDownloadButton: false,
            nativeScrollbars: true,
            pathInMiddlePanel: true,
            requiredPropsFirst: true,
            noAutoAuth: true,
            expandResponses: "all",
        }, document.getElementById('redoc-container'));
    </script>

    <script>
        // ── Print Preparation ──────────────────────────────────────────────
        // ReDoc uses hashed/generated class names so @media print selectors
        // are unreliable. Instead we inject a targeted <style> just before
        // the browser opens the print dialog, then remove it after.

        function injectPrintStyles() {
            const existing = document.getElementById('ironmind-print-style');
            if (existing) existing.remove();

            // Find ReDoc's internal layout elements by DOM position
            const redocWrap = document.querySelector('#redoc-container > redoc > div');
            if (redocWrap) {
                const children = redocWrap.children;
                // child[0] = sidebar, child[1] = main content, child[2] = right dark panel
                if (children[0]) children[0].setAttribute('data-print-hide', 'sidebar');
                if (children[2]) children[2].setAttribute('data-print-hide', 'rightpanel');
            }

            const style = document.createElement('style');
            style.id = 'ironmind-print-style';
            style.textContent = `
                @media print {
                    #topbar { display: none !important; }

                    [data-print-hide] { display: none !important; }

                    #redoc-container > redoc > div {
                        display: block !important;
                        width: 100% !important;
                    }

                    #redoc-container > redoc > div > div:nth-child(2) {
                        width: 100% !important;
                        max-width: 100% !important;
                        padding: 0 !important;
                        margin: 0 !important;
                    }

                    /* Force all backgrounds white */
                    * {
                        background: #fff !important;
                        color: #1e293b !important;
                        box-shadow: none !important;
                    }

                    pre, code {
                        background: #f8fafc !important;
                        color: #1e293b !important;
                        border: 1px solid #e2e8f0 !important;
                        font-size: 10px !important;
                        white-space: pre-wrap !important;
                        word-break: break-word !important;
                    }

                    h1, h2, h3 { page-break-after: avoid; }
                    table, pre  { page-break-inside: avoid; }

                    @page { margin: 1.5cm; size: A4; }
                    body { font-size: 12px !important; }
                }
            `;
            document.head.appendChild(style);
        }

        function cleanupPrintStyles() {
            // Remove data attributes
            document.querySelectorAll('[data-print-hide]').forEach(el => {
                el.removeAttribute('data-print-hide');
            });
            const style = document.getElementById('ironmind-print-style');
            if (style) style.remove();
        }

        window.addEventListener('beforeprint', injectPrintStyles);
        window.addEventListener('afterprint', cleanupPrintStyles);

        // Also wire the print button
        document.querySelector('.print-btn').addEventListener('click', function () {
            injectPrintStyles();
            setTimeout(() => window.print(), 100);
        });
    </script>
</body>

</html>
